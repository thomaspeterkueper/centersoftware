name: Production database migration

on:
  push:
    branches:
      - "db-production/initial-foundation"

permissions:
  contents: read

concurrency:
  group: centersoftware-production-database
  cancel-in-progress: false

jobs:
  migrate-production:
    if: github.event.created == false && github.repository == 'thomaspeterkueper/centersoftware' && github.actor == 'thomaspeterkueper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_PRODUCTION_DATABASE_URL is not configured."
            exit 1
          fi

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Verify target is reachable before migration
        shell: bash
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "select current_database();"

      - name: Apply tested migration atomically
        shell: bash
        run: |
          cat drizzle/0000_initial_foundation.sql drizzle/0001_seed_authorization.sql \
            | psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --single-transaction

      - name: Verify production schemas and tables
        shell: bash
        run: |
          schema_count=$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.schemata where schema_name in ('auth','app');")
          table_count=$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.tables where table_schema in ('auth','app') and table_type = 'BASE TABLE';")

          test "$schema_count" = "2"
          test "$table_count" = "10"

      - name: Verify production authorization seed
        shell: bash
        run: |
          permission_count=$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c 'select count(*) from app.permission;')
          role_count=$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c 'select count(*) from app.role;')
          owner_permission_count=$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "select count(*) from app.role_permission rp join app.role r on r.id = rp.role_id where r.key = 'owner';")

          test "$permission_count" = "13"
          test "$role_count" = "4"
          test "$owner_permission_count" = "13"

      - name: Production migration summary
        shell: bash
        run: |
          echo "Production foundation migration verified successfully."
